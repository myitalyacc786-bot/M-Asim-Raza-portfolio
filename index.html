/* copy */
function bindCopy(){
  document.querySelectorAll("[data-copy]").forEach(b=>{
    b.onclick=()=>{const el=$(b.dataset.copy), txt=el.textContent.trim();
      const done=()=>{b.textContent=T[lang].copied; setTimeout(()=>b.textContent=T[lang].copy,1600);};
      const sel=()=>{const r=document.createRange(); r.selectNodeContents(el); const s=getSelection(); s.removeAllRanges(); s.addRange(r);};
      try{navigator.clipboard.writeText(txt).then(done,sel);}catch(e){sel();}
    };
  });
}

/* reveal */
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
let io=null;
function observe(){
  if(reduce||!("IntersectionObserver" in window)) return;
  document.documentElement.classList.add("anim");
  io&&io.disconnect();
  io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target);}}),{threshold:.12,rootMargin:"0px 0px -5% 0px"});
  document.querySelectorAll(".rv").forEach(el=>{const r=el.getBoundingClientRect(); if(r.top<innerHeight) el.classList.add("in"); else io.observe(el);});
}

/* tilt micro-interaction */
function bindTilt(){
  if(reduce||matchMedia("(hover: none)").matches) return;
  document.querySelectorAll(".tilt").forEach(c=>{
    c.onpointermove=e=>{const r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;
      c.style.transform=`perspective(800px) rotateX(${(-y*6).toFixed(2)}deg) rotateY(${(x*8).toFixed(2)}deg) translateY(-4px)`;};
    c.onpointerleave=()=>{c.style.transform="";};
  });
}

  document.documentElement.addEventListener("mouseleave",()=>{ptr=null;});
  addEventListener("blur",()=>{ptr=null;});
  addEventListener("pointerup",e=>{ if(e.pointerType!=="mouse") setTimeout(()=>{ if(performance.now()-lastInput>1400) ptr=null; },1500); },{passive:true});

  // critically damped springs: smooth start, natural settle, no overshoot
  const spring=(o,tx,ty,w,dt)=>{ o.vx+=(w*w*(tx-o.x)-2*w*o.vx)*dt; o.vy+=(w*w*(ty-o.y)-2*w*o.vy)*dt; o.x+=o.vx*dt; o.y+=o.vy*dt; };
  const gaze={x:0,y:0,vx:0,vy:0}, head={x:0,y:0,vx:0,vy:0};
  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
  function targets(now){
    const r=stage.getBoundingClientRect();
    if(ptr && now-lastInput<6000){
      const ex=r.left+r.width*(0.5+(EYE.x-0.5)*.96), ey=r.top+r.height*(0.5+(EYE.y-0.5)*.96);
      const dx=ptr.x-ex, dy=ptr.y-ey, k=Math.max(260,r.width*.9);
      const cx=r.left+r.width/2, cy=r.top+r.height/2;
      return {gx:clamp(dx/Math.hypot(dx,k),-1,1), gy:clamp(dy/Math.hypot(dy,k*.8),-.9,.9),
              hx:clamp((ptr.x-cx)/(innerWidth*.5),-1,1), hy:clamp((ptr.y-cy)/(innerHeight*.5),-1,1)};
    }
    if(coarse && now>nextIdle){ idleT=Math.random()<.45?{x:0,y:0}:{x:(Math.random()-.5)*.5,y:(Math.random()-.5)*.3}; nextIdle=now+2600+Math.random()*2200; }
    return coarse?{gx:idleT.x,gy:idleT.y,hx:idleT.x*.4,hy:idleT.y*.4}:{gx:0,gy:0,hx:0,hy:0};
  }

  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  let t0=0, prev=0, visible=true, running=false, live=false;
  function frame(now){
    const dt=Math.min(.05,(now-prev)/1000||.016); prev=now;
    const T=targets(now);
    spring(gaze,T.gx,T.gy,9,dt); spring(head,T.hx,T.hy,3.2,dt);
    const intro=reduce?1:clamp((now-t0)/1400,0,1), ease=1-Math.pow(1-intro,3);
    gl.uniform1f(u.intro,ease); gl.uniform2f(u.gaze,gaze.x,gaze.y); gl.uniform2f(u.par,head.x,head.y);
    gl.uniform1f(u.light,.5+.5*head.x);
    const breathe=reduce?0:Math.sin(now/1000*1.1)*.0016;
    gl.uniform1f(u.scale,.96*(1.025-.025*ease+breathe));
    canvas.style.transform=`perspective(1400px) rotateY(${(head.x*3.6).toFixed(3)}deg) rotateX(${(-head.y*2.2).toFixed(3)}deg) translate3d(${(head.x*4).toFixed(2)}px,${(head.y*3).toFixed(2)}px,0)`;
    gl.clearColor(0,0,0,0); gl.clear(gl.COLOR_BUFFER_BIT);
    gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
    if(!live){ live=true; stage.classList.add("live"); }
  }
  function loop(now){ if(!visible||document.hidden){running=false;return;} frame(now); requestAnimationFrame(loop); }
  function start(){ if(running||reduce) return; running=true; prev=performance.now(); requestAnimationFrame(loop); }

  Promise.all([loadTex("portrait.png",0),loadTex("maps.png",1)]).then(()=>{
    size(); t0=performance.now();
    if(reduce) frame(t0);
    else{
      new IntersectionObserver(es=>{visible=es[0].isIntersecting; if(visible) start();}).observe(stage);
      document.addEventListener("visibilitychange",()=>{ if(!document.hidden&&visible) start(); });
      start();
    }
    let rz; addEventListener("resize",()=>{clearTimeout(rz); rz=setTimeout(()=>{size(); if(reduce) frame(performance.now());},80);});
  }).catch(()=>{ /* textures failed: keep the still photo */ });

  canvas.addEventListener("webglcontextlost",e=>{e.preventDefault(); stage.classList.remove("live"); running=false;});
  addEventListener("pagehide",()=>{ texs.forEach(t=>gl.deleteTexture(t)); gl.deleteBuffer(buf); gl.deleteProgram(prog); });
})();
})();
</script>
